name = "darakhti-bot"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Ҳар соат: ёдоварӣ ба соати интихобшудаи ҳар корбар (вақти Тоҷикистон) мерасад
[triggers]
crons = ["0 * * * *"]

[vars]
FIREBASE_PROJECT_ID = "darakhti-daromad"
TIMEZONE = "Asia/Dushanbe"
APP_URL = "https://yunusovshahriyor.github.io/darakhti_daromad/"

# Сирриҳо (дар GitHub Secrets ва тавассути workflow ба Cloudflare мераванд):
#   TELEGRAM_TOKEN, WEBHOOK_SECRET, FIREBASE_SERVICE_ACCOUNT
