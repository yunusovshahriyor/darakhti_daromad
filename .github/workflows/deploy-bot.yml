name: Deploy Telegram bot (Cloudflare Worker)

on:
  push:
    branches: [main]
    paths:
      - 'bot/**'
      - 'src/model.ts'
      - 'src/loanPlan.ts'
      - 'src/types.ts'
      - '.github/workflows/deploy-bot.yml'
  workflow_dispatch:

concurrency:
  group: bot
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      # То вақте ки сирриҳои Cloudflare илова нашудаанд, ин workflow бе хато гузашта меравад
      - name: Check secrets
        env:
          S_CF_TOKEN: ${{ (secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN) != '' }}
          S_CF_ACCOUNT: ${{ (secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID) != '' }}
          S_TG: ${{ secrets.TELEGRAM_TOKEN != '' }}
          S_HOOK: ${{ secrets.WEBHOOK_SECRET != '' }}
          S_FB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
        run: |
          echo "CF_API_TOKEN set: $S_CF_TOKEN"
          echo "CF_ACCOUNT_ID set: $S_CF_ACCOUNT"
          echo "TELEGRAM_TOKEN set: $S_TG"
          echo "WEBHOOK_SECRET set: $S_HOOK"
          echo "FIREBASE_SERVICE_ACCOUNT set: $S_FB"
          [ "$S_CF_TOKEN" = "true" ] || echo "::warning::CLOUDFLARE_API_TOKEN is empty - skipping bot deploy"

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - if: env.CF_TOKEN != ''
        run: npm ci
      - if: env.CF_TOKEN != ''
        run: npm install --no-audit --no-fund
        working-directory: bot
      - if: env.CF_TOKEN != ''
        run: npx tsc -p bot

      - if: env.CF_TOKEN != ''
        name: Deploy Worker
        id: wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: bot
          command: deploy
          secrets: |
            TELEGRAM_TOKEN
            WEBHOOK_SECRET
            FIREBASE_SERVICE_ACCOUNT
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - if: env.CF_TOKEN != ''
        name: Set Telegram webhook and commands
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          URL: ${{ steps.wrangler.outputs.deployment-url }}
        run: |
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_TOKEN}/setWebhook" \
            --data-urlencode "url=${URL%/}/webhook" \
            --data-urlencode "secret_token=${WEBHOOK_SECRET}" \
            --data-urlencode 'allowed_updates=["message","callback_query"]'
          echo
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_TOKEN}/setMyCommands" \
            --data-urlencode 'commands=[{"command":"start","description":"Менюи асосӣ"},{"command":"xulosa","description":"Хулосаи моҳ"},{"command":"qarzho","description":"Қарзҳо ва пардохтҳои навбатӣ"},{"command":"yodovari","description":"Ёдоварии имрӯз"},{"command":"help","description":"Роҳнамо"},{"command":"stop","description":"Ҷудо кардани бот аз аккаунт"}]'
          echo
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_TOKEN}/setMyCommands" \
            --data-urlencode 'language_code=en' \
            --data-urlencode 'commands=[{"command":"start","description":"Main menu"},{"command":"summary","description":"Monthly summary"},{"command":"debts","description":"Debts and upcoming payments"},{"command":"reminders","description":"Today'"'"'s payment reminders"},{"command":"help","description":"Help"},{"command":"stop","description":"Unlink the bot from your account"}]'
          echo
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_TOKEN}/setChatMenuButton" \
            --data-urlencode 'menu_button={"type":"web_app","text":"Барнома","web_app":{"url":"https://yunusovshahriyor.github.io/darakhti_daromad/"}}'
          echo
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_TOKEN}/setMyDescription" \
            --data-urlencode 'description=Помощник приложения «Дарахти даромад»: напоминает о платежах по кредитам и долгам, присылает сводку доходов и расходов за месяц, показывает долги и ближайшие платежи. Подключите бота в приложении: Профиль → Telegram-бот.'
          echo
          curl -fsS "https://api.telegram.org/bot${TELEGRAM_TOKEN}/setMyShortDescription" \
            --data-urlencode 'short_description=Напоминания о платежах по долгам и кредитам и сводка финансов из приложения «Дарахти даромад».'
