name: Publish Telegram post

# Дастӣ иҷро мешавад (Actions → Run workflow) — танҳо баъди тасдиқи муаллиф.
on:
  workflow_dispatch:
    inputs:
      file:
        description: 'Файли пост (масалан posts/2026-10-12-salom.html), матн дар формати Telegram HTML'
        required: true
      photo:
        description: 'Ихтиёрӣ: роҳи акс дар репо (масалан posts/img/a.jpg)'
        required: false
      button_text:
        description: 'Ихтиёрӣ: матни тугма дар поёни пост (масалан «🌳 Открыть приложение»)'
        required: false
      button_url:
        description: 'Ихтиёрӣ: истиноди тугма (масалан https://t.me/<бот>/<mini_app>)'
        required: false
      dry_run:
        description: 'true = танҳо санҷиш, ба канал намефиристад'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Send to Telegram channel
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          POST_FILE: ${{ inputs.file }}
          PHOTO: ${{ inputs.photo }}
          DRY_RUN: ${{ inputs.dry_run }}
          BTN_TEXT: ${{ inputs.button_text }}
          BTN_URL: ${{ inputs.button_url }}
        run: |
          set -euo pipefail
          case "$POST_FILE" in posts/*.html) ;; *) echo "Файл бояд posts/*.html бошад"; exit 1;; esac
          case "$POST_FILE$PHOTO" in *..*) echo "Роҳи нодуруст"; exit 1;; esac
          [ -f "$POST_FILE" ] || { echo "Файл ёфт нашуд: $POST_FILE"; exit 1; }
          [ -n "$CHANNEL_ID" ] || { echo "Сирри CHANNEL_ID танзим нашудааст"; exit 1; }
          MARKUP='{}'
          if [ -n "$BTN_TEXT" ] || [ -n "$BTN_URL" ]; then
            case "$BTN_URL" in https://*) ;; *) echo "button_url бояд бо https:// оғоз шавад"; exit 1;; esac
            [ -n "$BTN_TEXT" ] || { echo "button_text холӣ аст"; exit 1; }
            MARKUP=$(jq -cn --arg t "$BTN_TEXT" --arg u "$BTN_URL" '{inline_keyboard:[[{text:$t,url:$u}]]}')
          fi
          LEN=$(wc -m < "$POST_FILE")
          echo "Матн: $LEN аломат"
          if [ "$DRY_RUN" = "true" ]; then echo "dry_run — ирсол намешавад"; exit 0; fi

          if [ -n "$PHOTO" ]; then
            [ "$LEN" -le 1024 ] || { echo "Барои акс матн ≤1024 аломат бошад"; exit 1; }
            RESP=$(curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendPhoto" \
              --form-string chat_id="$CHANNEL_ID" --form-string parse_mode=HTML \
              --form-string caption="$(cat "$POST_FILE")" -F photo=@"$PHOTO" \
              --form-string reply_markup="$MARKUP")
          else
            [ "$LEN" -le 4096 ] || { echo "Матн ≤4096 аломат бошад"; exit 1; }
            RESP=$(jq -n --arg chat "$CHANNEL_ID" --rawfile text "$POST_FILE" --argjson rm "$MARKUP" \
              '{chat_id:$chat,text:$text,parse_mode:"HTML",link_preview_options:{is_disabled:false}} + (if $rm == {} then {} else {reply_markup:$rm} end)' |
              curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
                -H 'Content-Type: application/json' -d @-)
          fi
          echo "$RESP" | jq '{ok, error_code, description, message_id: .result.message_id}'
          [ "$(echo "$RESP" | jq -r .ok)" = "true" ]
